[build]
  command = "npm run build"
  publish = "dist"

# Customer portal only. The backend endpoint will be added to the OnStar server
# before this website revision is published to production.
[[redirects]]
  from = "/api/customer/*"
  to = "https://vpn.onstareh.com/v2/customer-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
